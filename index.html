<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      document.documentElement.className = "js";
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      try {
        var savedTheme = localStorage.getItem("theme");
        if (savedTheme)
          document.documentElement.setAttribute("data-theme", savedTheme);
      } catch (error) {}
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Valentin Kirilov — software developer. I'm trying to make the world a better place by writing code. Projects include PizzaTime and Redis Insight."
    />
    <meta
      name="keywords"
      content="valentin, kirilov, valkirilov, portfolio, software developer, web developer, pizzatime, redis insight"
    />
    <meta name="author" content="Valentin Kirilov" />
    <title>Valentin Kirilov | Software Developer</title>

    <meta property="og:title" content="Valentin Kirilov | Software Developer" />
    <meta
      property="og:description"
      content="I'm trying to make the world a better place by writing code."
    />
    <meta property="og:url" content="http://valkirilov.github.io" />
    <meta
      property="og:image"
      content="http://valkirilov.github.io/apple-touch-icon.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link href="styles/css/main.css" rel="stylesheet" />

    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=KmmNxX8Qyr" />
    <link
      rel="icon"
      type="image/png"
      href="images/favicons/favicon-32x32.png?v=KmmNxX8Qyr"
      sizes="32x32"
    />
    <link
      rel="icon"
      type="image/png"
      href="images/favicons/favicon-16x16.png?v=KmmNxX8Qyr"
      sizes="16x16"
    />
    <link rel="shortcut icon" href="images/favicons/favicon.ico?v=KmmNxX8Qyr" />
    <meta name="theme-color" content="#F7EDD8" />
  </head>
  <body>
    <button
      id="theme-toggle"
      class="theme-toggle"
      type="button"
      aria-label="Toggle dark mode"
    >
      <span class="icon-sun"></span>
      <span class="icon-moon"></span>
    </button>

    <main class="page">
      <!-- Hero (starts centered, then lifts to the top) -->
      <div class="stage">
        <section class="hero">
          <img
            class="avatar"
            src="images/avatar.png"
            alt="Valentin Kirilov"
            width="113"
            height="113"
          />
          <div>
            <h1>
              <span class="hey">Hey there,</span>
              <span class="intro">I'm <em>Valentin.</em></span>
            </h1>
            <p class="tagline">
              <span class="type-normal"></span>
              <em class="type-accent"></em>
              <span class="caret"></span>
            </p>
            <noscript>
              <p class="tagline tagline-fallback">
                I'm trying to make the world a better place by
                <em>writing code.</em>
              </p>
            </noscript>
          </div>
        </section>
      </div>

      <!-- Projects -->
      <section class="projects">
        <div class="section-head">
          <h2 class="label">Projects</h2>
          <button id="more-toggle" class="more-toggle" type="button">
            More projects
          </button>
        </div>

        <div class="cards">
          <button
            class="card featured pizza"
            type="button"
            data-project="pizza"
          >
            <div class="card-icon">
              <img
                src="images/projects/pizza-time/logo.png"
                alt="PizzaTime"
                width="52"
                height="52"
              />
            </div>
            <div>
              <h3>PizzaTime</h3>
              <p>
                Say &ldquo;thanks&rdquo; to your teammates with a slice of pizza.
              </p>
            </div>
          </button>

          <button
            class="card featured insight"
            type="button"
            data-project="insight"
          >
            <div class="card-icon">
              <img
                src="images/projects/redis-insight/logo.png"
                alt="Redis Insight"
                width="52"
                height="52"
              />
            </div>
            <div>
              <h3>Redis Insight</h3>
              <p>A GUI to visualize, query, and debug your Redis data.</p>
            </div>
          </button>
        </div>

        <div id="more-projects" class="cards more" hidden>
          <button
            class="card featured thumb"
            type="button"
            data-project="jspres"
          >
            <div class="card-icon">
              <img
                src="images/projects/jspres/logo.png"
                alt="JSpres"
                width="52"
                height="52"
              />
            </div>
            <div>
              <h3>JSpres</h3>
              <p>A web tool for creating presentations with impress.js.</p>
            </div>
          </button>
          <button
            class="card featured thumb"
            type="button"
            data-project="whattodo"
          >
            <div class="card-icon">
              <img
                src="images/projects/what-to-do/logo.png"
                alt="What to do?"
                width="52"
                height="52"
              />
            </div>
            <div>
              <h3>What to do?</h3>
              <p>Can't decide what to do? We'll help you pick.</p>
            </div>
          </button>
          <button
            class="card featured thumb"
            type="button"
            data-project="easymath"
          >
            <div class="card-icon">
              <img
                src="images/projects/easy-math/logo.png"
                alt="Easy Math"
                width="52"
                height="52"
              />
            </div>
            <div>
              <h3>Easy Math</h3>
              <p>
                A quick game that tests your brain and reaction with simple math.
              </p>
            </div>
          </button>
        </div>
      </section>

      <!-- Find me on -->
      <section class="contacts">
        <h2 class="label">Find me on</h2>
        <div class="pills">
          <a
            class="pill"
            href="https://www.linkedin.com/in/valentin-kirilov-5b599351"
            target="_blank"
            rel="noopener"
          >
            <span class="pill-icon linkedin"></span>
            LinkedIn
          </a>
          <a
            class="pill"
            href="https://github.com/valkirilov"
            target="_blank"
            rel="noopener"
          >
            <span class="pill-icon github"></span>
            GitHub
          </a>
          <a
            class="pill"
            href="https://www.behance.net/valkirilov"
            target="_blank"
            rel="noopener"
          >
            <span class="pill-icon behance"></span>
            Behance
          </a>
        </div>
      </section>
    </main>

    <!-- Project modal (populated by app.js) -->
    <div
      id="modal"
      class="modal"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
      tabindex="-1"
    >
      <div class="modal-card">
        <div class="modal-head">
          <h3 id="modal-title" class="modal-title"></h3>
          <button
            class="head-nav prev"
            type="button"
            aria-label="Previous project"
            data-step="-1"
          ></button>
          <button
            class="head-nav next"
            type="button"
            aria-label="Next project"
            data-step="1"
          ></button>
          <button class="modal-close" type="button" aria-label="Close"></button>
        </div>
        <div class="modal-gallery" hidden>
          <img class="modal-shot" src="" alt="" />
          <div class="modal-thumbs" hidden></div>
        </div>
        <p class="modal-body"></p>
        <div class="modal-actions"></div>
      </div>
      <!-- Prev/next project arrows: fixed to the viewport centre (hidden on mobile) -->
      <div class="modal-nav-track">
        <button
          class="modal-nav prev"
          type="button"
          aria-label="Previous project"
          data-step="-1"
        ></button>
        <button
          class="modal-nav next"
          type="button"
          aria-label="Next project"
          data-step="1"
        ></button>
      </div>
    </div>

    <!-- Lightbox for project screenshots -->
    <div
      id="lightbox"
      class="lightbox"
      hidden
      role="dialog"
      aria-modal="true"
      aria-label="Screenshot viewer"
      tabindex="-1"
    >
      <button class="lightbox-close" type="button" aria-label="Close"></button>
      <button
        class="lightbox-nav prev"
        type="button"
        aria-label="Previous"
      ></button>
      <img class="lightbox-img" src="" alt="" />
      <button
        class="lightbox-nav next"
        type="button"
        aria-label="Next"
      ></button>
    </div>

    <script type="module" src="scripts/app.js"></script>

    <!-- Google Analytics (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=UA-34075082-1"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "UA-34075082-1");
    </script>
  </body>
</html>
